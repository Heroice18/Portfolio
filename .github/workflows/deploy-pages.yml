name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Determine application version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.1-SNAPSHOT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: mvn --batch-mode clean package -Drevision=${{ steps.version.outputs.version }}

      - name: Prepare static Pages artifact
        run: |
          mkdir -p pages
          cp -R target/classes/static/* pages/
          if [ -d target/classes/templates ]; then
            cp -R target/classes/templates/* pages/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4