name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Determine application version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.1-SNAPSHOT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: mvn --batch-mode clean package -Drevision=${{ steps.version.outputs.version }}

      - name: Prepare static Pages artifact
        shell: bash
        run: |
          mkdir -p pages
          java -jar "target/portfolio-${{ steps.version.outputs.version }}.jar" \
            --server.port=8080 \
            '--spring.datasource.url=jdbc:h2:mem:pages;DB_CLOSE_DELAY=-1' \
            > /tmp/portfolio-pages.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/ -o pages/index.html; then
              break
            fi
            sleep 2
          done

          if [ ! -s pages/index.html ]; then
            cat /tmp/portfolio-pages.log
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8080/about -o pages/about.html
          cp -R target/classes/static/. pages/

          for page in pages/index.html pages/about.html; do
            sed -i \
              -e 's|href="/about"|href="./about.html"|g' \
              -e 's|href="/"|href="./index.html"|g' \
              -e 's|href="/css/|href="./css/|g' \
              -e 's|src="/js/|src="./js/|g' \
              "$page"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4