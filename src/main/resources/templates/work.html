<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">Experience</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <div class="site-shell">
        <header th:replace="~{fragments :: site-header}"></header>

        <main class="page-content">
            <div class="container work-page">
                <section class="content-panel work-intro" aria-labelledby="experience-title">
                    <p class="eyebrow">Professional background</p>
                    <h1 id="experience-title">Experience</h1>
                    <p>Explore relevant roles, collaborations, and milestones.</p>
                </section>

                <section class="content-panel work-section" aria-labelledby="roles-title">
                    <p class="eyebrow">01</p>
                    <h2 id="roles-title">Roles &amp; Experience</h2>
                    <p>Add relevant roles, collaborations, or milestones here.</p>
                </section>
            </div>
        </main>

        <footer th:replace="~{fragments :: site-footer}"></footer>
    </div>
    <script th:src="@{/js/site.js}"></script>
</body>
</html>
