<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <header class="site-header" th:fragment="site-header">
        <nav class="nav container" aria-label="Primary navigation">
            <a class="brand" href="/">
                <img th:src="@{/images/headshot-small.jpg}" alt="" />
                <span>My Portfolio | Brandon</span>
            </a>
            <div class="nav-links">
                <a href="/" th:classappend="${page == 'Home'} ? ' active'">Home</a>
                <a href="/about" th:classappend="${page == 'About'} ? ' active'">About</a>
                <a href="/work" th:classappend="${page == 'Work'} ? ' active'">Experience</a>
                <a href="/projects" th:classappend="${page == 'Projects'} ? ' active'">Projects</a>
                <a href="/technologies" th:classappend="${page == 'Technologies'} ? ' active'">Technologies</a>
            </div>
        </nav>
    </header>

    <footer class="site-footer" th:fragment="site-footer">
        <div class="container footer-content">
            <div class="footer-contact">
                <span class="footer-name">Brandon Ison</span>
                <a href="mailto:heroice18@gmail.com">heroice18@gmail.com</a>
                <a href="https://www.linkedin.com/in/brandon-ison/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <span>Greater Phoenix, Arizona USA</span>
            </div>
            <span class="footer-copyright">&copy; <span id="current-year">2026</span></span>
        </div>
    </footer>

    <section class="content-panel container page-feature"
             th:fragment="page-feature(feature)"
             aria-label="Page introduction">
        <img class="page-feature-image" th:src="@{${feature.image}}" th:alt="${feature.imageAlt}" />
        <div class="page-feature-copy">
            <p class="eyebrow" th:if="${!#strings.isEmpty(feature.eyebrow)}" th:text="${feature.eyebrow}"></p>
            <h1 th:text="${feature.heading}">Page title</h1>
            <p th:text="${feature.description}">Page introduction.</p>
        </div>
    </section>

    <article class="cascade-card content-panel"
             th:fragment="cascade-card(card)"
             th:classappend="${card.reverse} ? ' cascade-card--reverse'">
        <div class="cascade-card-media">
            <img class="cascade-card-image"
                 th:if="${!#strings.isEmpty(card.image)}"
                 th:src="@{${card.image}}"
                 th:alt="${card.imageAlt}" />
            <span class="cascade-card-placeholder"
                  th:unless="${!#strings.isEmpty(card.image)}"
                  th:text="${card.category}">Project category</span>
        </div>
        <div class="cascade-card-copy">
            <p class="eyebrow" th:if="${!#strings.isEmpty(card.category) and !#strings.isEmpty(card.image)}"
               th:text="${card.category}">Category</p>
            <h3 th:text="${card.heading}">Card title</h3>
            <p th:text="${card.description}">Card description.</p>
            <a th:if="${!#strings.isEmpty(card.link)}"
               th:href="${card.link}"
               target="_blank"
               rel="noopener noreferrer"
               th:text="${card.linkText}">View project</a>
        </div>
    </article>

    <section class="content-panel container linkedin-panel"
             th:fragment="linkedin-carousel(title, posts, carouselId)"
             th:if="${posts != null and !#lists.isEmpty(posts)}"
             data-carousel
             th:attr="aria-labelledby=|${carouselId}-title|">
        <h2 th:id="|${carouselId}-title|">
            <a href="https://www.linkedin.com/in/brandon-ison/" target="_blank" rel="noopener noreferrer"
               th:text="${title}">From My LinkedIn ➜</a>
        </h2>
        <div class="linkedin-swiper swiper" aria-label="LinkedIn posts">
            <div class="swiper-wrapper">
                <article class="swiper-slide linkedin-post" th:each="post : ${posts}">
                    <iframe
                            th:src="${post.embedUrl}"
                            title="LinkedIn post by Brandon Ison"
                            th:height="${post.height}"
                            allowfullscreen=""
                            loading="lazy"></iframe>
                </article>
            </div>
            <div class="slider-controls linkedin-slider-controls" th:if="${posts.size() > 1}" hidden>
                <button class="slider-arrow slider-prev" type="button" aria-label="Previous LinkedIn post">
                    <span aria-hidden="true">&lsaquo;</span>
                </button>
                <div class="swiper-pagination" aria-label="Choose a LinkedIn post"></div>
                <button class="slider-arrow slider-next" type="button" aria-label="Next LinkedIn post">
                    <span aria-hidden="true">&rsaquo;</span>
                </button>
            </div>
        </div>
    </section>
</body>
</html>
