<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">Projects</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <div class="site-shell">
        <header th:replace="~{fragments :: site-header}"></header>

        <main class="page-content">
            <section th:replace="~{fragments :: page-feature(${pageFeature})}"></section>

            <section class="container cascade-section" aria-labelledby="personal-projects-title">
                <h2 id="personal-projects-title">Personal Projects</h2>
                <div class="cascade-list">
                    <th:block th:each="card : ${cascadeCards}">
                        <article th:replace="~{fragments :: cascade-card(${card})}"></article>
                    </th:block>
                </div>
            </section>

        </main>

        <footer th:replace="~{fragments :: site-footer}"></footer>
    </div>
    <script th:src="@{/js/site.js}"></script>
</body>
</html>
